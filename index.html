<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💊 شمارش معکوس تا داروسازی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

:root {
    --red: #e11d48;
    --red-light: #fb7185;
    --red-dark: #9f1239;
    --gold: #fbbf24;
    --gold-light: #fcd34d;
    --gold-dark: #d97706;
    --purple: #8b5cf6;
    --blue: #3b82f6;
    --cyan: #06b6d4;
    --green: #10b981;
    --black: #0a0a0f;
    --black-2: #12121a;
    --black-3: #1c1c26;
    --border: #2a2a35;
    --text: #f5f5f7;
    --text-dim: #a1a1aa;
    --radius: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { min-height: 100%; overflow-x: hidden; }

body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--black);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.6;
    background-image:
        radial-gradient(circle at 15% 15%, rgba(225,29,72,0.12), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(139,92,246,0.1), transparent 45%);
    background-attachment: fixed;
    overflow-y: auto;
}

/* ============================================
   کانتینر اصلی
============================================ */
.countdown-wrapper {
    position: relative;
    max-width: 950px;
    width: 100%;
    border-radius: var(--radius);
    padding: 3px;
    overflow: hidden;
    animation: wrapperFloat 6s ease-in-out infinite;
    z-index: 1;
}

@keyframes wrapperFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

/* حاشیه گرادیانی چرخان */
.countdown-wrapper::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 200%; height: 200%;
    background: conic-gradient(
        from 0deg,
        var(--red) 0deg,
        var(--gold) 60deg,
        var(--purple) 120deg,
        var(--blue) 180deg,
        var(--cyan) 240deg,
        var(--red) 360deg
    );
    transform: translate(-50%, -50%);
    animation: rotateBorder 6s linear infinite;
    z-index: -1;
    filter: blur(1px);
}

@keyframes rotateBorder {
    to { transform: translate(-50%, -50%) rotate(360deg); }
}

/* ============================================
   کارت اصلی
============================================ */
.countdown-card {
    background: linear-gradient(135deg, #0a0a0f 0%, #12121a 40%, #1a1a2e 100%);
    border-radius: 22px;
    padding: 35px 30px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
}

/* ============================================
   لایه‌های پس‌زمینه انیمیشنی
============================================ */

/* ۱. ذرات شناور */
.particles-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.particle {
    position: absolute;
    opacity: 0.6;
    animation: particleFloat linear infinite;
    filter: drop-shadow(0 0 8px currentColor);
    will-change: transform;
    font-size: 16px;
}

@keyframes particleFloat {
    0% {
        transform: translateY(110%) translateX(0) rotate(0deg) scale(0.3);
        opacity: 0;
    }
    10% { opacity: 0.7; }
    50% { opacity: 1; }
    90% { opacity: 0.5; }
    100% {
        transform: translateY(-120%) translateX(60px) rotate(720deg) scale(1.4);
        opacity: 0;
    }
}

/* ۲. امواج نور Aurora */
.aurora-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.aurora {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
    mix-blend-mode: screen;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
}

.aurora-1 {
    width: 350px; height: 350px;
    background: var(--red);
    top: -100px; right: -80px;
    animation: aurora1 12s infinite;
}

.aurora-2 {
    width: 300px; height: 300px;
    background: var(--purple);
    bottom: -120px; left: -80px;
    animation: aurora2 14s infinite;
}

.aurora-3 {
    width: 250px; height: 250px;
    background: var(--gold);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: aurora3 10s infinite;
    opacity: 0.25;
}

@keyframes aurora1 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
    50% { transform: translate(-100px, 100px) scale(1.4); opacity: 0.7; }
}

@keyframes aurora2 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
    50% { transform: translate(120px, -80px) scale(1.3); opacity: 0.6; }
}

@keyframes aurora3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.25; }
    50% { transform: translate(-50%, -50%) scale(2); opacity: 0.5; }
}

/* ۳. ستاره‌های چشمک‌زن */
.stars-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
    animation: starTwinkle 2s ease-in-out infinite;
    box-shadow: 0 0 6px white;
}

@keyframes starTwinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
}

/* ============================================
   محتوای اصلی
============================================ */
.content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 24px;
    text-align: center;
}

/* هدر — آیکون + عنوان */
.header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

/* آیکون دارو */
.hero-icon-wrap {
    position: relative;
    width: 90px; height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-icon-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--red), var(--gold), var(--purple), var(--cyan), var(--red));
    animation: rotateBorder 4s linear infinite;
    filter: blur(3px);
}

.hero-icon-wrap::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
    z-index: 1;
}

.hero-icon {
    font-size: 2.6rem;
    position: relative;
    z-index: 2;
    animation: iconBounce 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 15px rgba(225,29,72,0.8));
}

@keyframes iconBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.1); }
}

/* حلقه‌های دور آیکون */
.hero-ring {
    position: absolute;
    inset: -10px;
    border: 2px dashed rgba(251,191,36,0.4);
    border-radius: 50%;
    animation: rotateBorder 8s linear infinite reverse;
}

.hero-ring-2 {
    position: absolute;
    inset: -20px;
    border: 1px solid rgba(225,29,72,0.3);
    border-radius: 50%;
    animation: rotateBorder 12s linear infinite;
}

@keyframes rotateBorder {
    to { transform: rotate(360deg); }
}

/* عنوان */
.title {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1.3;
    background: linear-gradient(90deg, #fff, var(--red-light), var(--gold), var(--red-light), #fff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 3s linear infinite;
}

@keyframes textShine {
    to { background-position: 200% center; }
}

.subtitle {
    font-size: 0.95rem;
    color: var(--text-dim);
}

.subtitle .highlight {
    color: var(--gold);
    font-weight: 800;
    position: relative;
}

.subtitle .highlight::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: underlineShine 2s linear infinite;
}

@keyframes underlineShine {
    0%, 100% { opacity: 0.5; transform: scaleX(0.8); }
    50% { opacity: 1; transform: scaleX(1); }
}

/* ============================================
   تایمر اصلی
============================================ */
.timer-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 8px;
}

.time-card {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 22px 10px;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    isolation: isolate;
    cursor: default;
}

.time-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent, var(--red)), transparent);
    opacity: 0.7;
}

.time-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--accent-glow, rgba(225,29,72,0.15)), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s;
    z-index: -1;
}

.time-card:hover {
    border-color: var(--accent, var(--red));
    transform: translateY(-6px) scale(1.03);
    box-shadow: 
        0 15px 40px var(--accent-glow, rgba(225,29,72,0.35)),
        inset 0 0 20px rgba(255,255,255,0.02);
}

.time-card:hover::after { opacity: 1; }

/* روز */
.time-card.days {
    --accent: var(--red);
    --accent-glow: rgba(225,29,72,0.4);
}

/* ساعت */
.time-card.hours {
    --accent: var(--gold);
    --accent-glow: rgba(251,191,36,0.4);
}

/* دقیقه */
.time-card.mins {
    --accent: var(--cyan);
    --accent-glow: rgba(6,182,212,0.4);
}

/* ثانیه */
.time-card.secs {
    --accent: var(--purple);
    --accent-glow: rgba(139,92,246,0.4);
}

/* عدد */
.time-number {
    display: block;
    font-size: 3.4rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    color: var(--accent, var(--red));
    text-shadow: 
        0 0 20px var(--accent-glow, rgba(225,29,72,0.8)),
        0 0 40px var(--accent-glow, rgba(225,29,72,0.4));
    transition: all 0.3s;
    position: relative;
    z-index: 2;
}

/* لرزش لحظه‌ای عدد */
.time-number.tick {
    animation: tickNumber 0.5s ease;
}

@keyframes tickNumber {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); filter: brightness(1.5); }
    60% { transform: scale(0.95); }
    100% { transform: scale(1); }
}

/* برچسب */
.time-label {
    display: block;
    font-size: 0.82rem;
    color: var(--text-dim);
    font-weight: 700;
    margin-top: 8px;
    letter-spacing: 1px;
    position: relative;
    z-index: 2;
}

/* جداکننده بین کارت‌ها — فقط روی دسکتاپ */
.timer-grid::before,
.timer-grid::after {
    content: '';
    display: none;
}

/* ============================================
   پیام پایین
============================================ */
.dream-box {
    position: relative;
    padding: 22px 20px;
    background: linear-gradient(135deg, rgba(225,29,72,0.08), rgba(139,92,246,0.06), rgba(251,191,36,0.05));
    border: 1.5px dashed rgba(225,29,72,0.4);
    border-radius: 18px;
    overflow: hidden;
    margin-top: 8px;
}

.dream-box::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, rgba(251,191,36,0.15), transparent);
    animation: rotateBorder 6s linear infinite;
    pointer-events: none;
}

.dream-text {
    position: relative;
    z-index: 1;
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--red-light), var(--gold), var(--red-light));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 3s linear infinite;
}

.dream-sub {
    position: relative;
    z-index: 1;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: 6px;
}

/* ============================================
   نوار پیشرفت
============================================ */
.progress-wrap {
    margin-top: 4px;
}

.progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.82rem;
    color: var(--text-dim);
    font-weight: 600;
}

.progress-header .label {
    display: flex;
    align-items: center;
    gap: 6px;
}

.progress-header .percent {
    color: var(--gold);
    font-weight: 900;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(251,191,36,0.6);
}

.progress-bg {
    height: 14px;
    background: rgba(0,0,0,0.5);
    border-radius: 50px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red-dark), var(--red), var(--gold), var(--gold-light), var(--gold));
    background-size: 200% 100%;
    border-radius: 50px;
    width: 0%;
    transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(251,191,36,0.6);
    animation: fillShine 3s linear infinite;
}

@keyframes fillShine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
}

.progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: barShine 2s linear infinite;
}

@keyframes barShine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* درخشش روی نوار */
.progress-glow {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--gold-light), transparent 70%);
    pointer-events: none;
    animation: glowMove 3s ease-in-out infinite;
    filter: blur(4px);
}

@keyframes glowMove {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

/* ============================================
   کارت‌های آمار پایین
============================================ */
.stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 6px;
}

.stat-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}

.stat-box::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 40%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
}

.stat-box:hover {
    border-color: var(--accent);
    background: rgba(255,255,255,0.05);
    transform: translateY(-3px);
}

.stat-box.weeks { --accent: var(--red-light); }
.stat-box.months { --accent: var(--gold); }
.stat-box.percent { --accent: var(--green); }

.stat-value {
    display: block;
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 15px currentColor;
}

.stat-label {
    display: block;
    font-size: 0.68rem;
    color: var(--text-dim);
    margin-top: 6px;
    font-weight: 600;
}

/* ============================================
   جمله انگیزشی با تایپ متحرک
============================================ */
.quote-box {
    margin-top: 10px;
    padding: 16px 20px;
    background: rgba(0,0,0,0.3);
    border-radius: 14px;
    border-right: 3px solid var(--red);
    text-align: right;
    font-size: 0.88rem;
    color: var(--text-dim);
    line-height: 1.9;
    position: relative;
    overflow: hidden;
}

.quote-box::before {
    content: '❝';
    position: absolute;
    top: 0; right: 12px;
    font-size: 3rem;
    color: var(--red);
    opacity: 0.15;
    line-height: 1;
}

.quote-text {
    position: relative;
    z-index: 1;
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--red);
    vertical-align: middle;
    margin-right: 4px;
    animation: cursorBlink 0.7s steps(2) infinite;
}

@keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

/* ============================================
   حالت رسیدن — جشن
============================================ */
.celebrate-view {
    display: none;
    text-align: center;
    padding: 40px 20px;
    position: relative;
    z-index: 2;
}

.celebrate-view.active {
    display: block;
    animation: celebrateIn 1s ease;
}

@keyframes celebrateIn {
    0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    60% { transform: scale(1.1) rotate(5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.celebrate-icon {
    font-size: 6rem;
    animation: celebrateBounce 1.2s ease infinite;
    filter: drop-shadow(0 0 30px rgba(251,191,36,0.8));
}

@keyframes celebrateBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-25px) scale(1.15); }
}

.celebrate-title {
    font-size: 3rem;
    font-weight: 900;
    margin: 20px 0 10px;
    background: linear-gradient(90deg, var(--gold), var(--red-light), var(--gold));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 2s linear infinite;
    letter-spacing: -2px;
}

.celebrate-sub {
    font-size: 1.1rem;
    color: var(--text-dim);
}

/* کاغذرنگی‌های جشن */
.confetti {
    position: absolute;
    width: 10px; height: 10px;
    top: -20px;
    animation: confettiFall linear infinite;
    opacity: 0.9;
}

@keyframes confettiFall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

/* ============================================
   Responsive
============================================ */
@media (max-width: 800px) {
    .time-number { font-size: 2.6rem; }
    .title { font-size: 1.6rem; }
    .timer-grid { gap: 10px; }
    .time-card { padding: 18px 8px; border-radius: 14px; }
}

@media (max-width: 600px) {
    body { padding: 12px; }
    .countdown-card { padding: 24px 16px; border-radius: 18px; }
    
    .hero-icon-wrap { width: 70px; height: 70px; }
    .hero-icon { font-size: 2rem; }
    .hero-ring { inset: -8px; }
    .hero-ring-2 { inset: -16px; }
    
    .title { font-size: 1.3rem; letter-spacing: -0.5px; }
    .subtitle { font-size: 0.82rem; }
    
    .timer-grid { gap: 7px; }
    .time-card { padding: 14px 5px; border-radius: 12px; }
    .time-number { font-size: 1.8rem; letter-spacing: -1px; }
    .time-label { font-size: 0.65rem; margin-top: 5px; letter-spacing: 0.5px; }
    
    .dream-text { font-size: 1.15rem; }
    .dream-sub { font-size: 0.72rem; }
    .dream-box { padding: 16px 14px; }
    
    .progress-header { font-size: 0.72rem; }
    .progress-header .percent { font-size: 0.9rem; }
    .progress-bg { height: 11px; }
    
    .stat-value { font-size: 1.2rem; }
    .stat-label { font-size: 0.6rem; }
    
    .quote-box { padding: 12px 14px; font-size: 0.78rem; }
    
    .celebrate-icon { font-size: 4rem; }
    .celebrate-title { font-size: 2rem; }
    .celebrate-sub { font-size: 0.9rem; }
}

@media (max-width: 380px) {
    .time-number { font-size: 1.5rem; }
    .title { font-size: 1.1rem; }
    .dream-text { font-size: 1rem; }
    .stat-value { font-size: 1rem; }
}
</style>
</head>
<body>

<div class="countdown-wrapper">
    <div class="countdown-card">

        <!-- لایه‌های انیمیشنی پس‌زمینه -->
        <div class="aurora-layer">
            <div class="aurora aurora-1"></div>
            <div class="aurora aurora-2"></div>
            <div class="aurora aurora-3"></div>
        </div>
        <div class="particles-layer" id="particlesLayer"></div>
        <div class="stars-layer" id="starsLayer"></div>

        <!-- ============ حالت شمارش ============ -->
        <div class="content" id="countdownView">

            <div class="header">
                <div class="hero-icon-wrap">
                    <div class="hero-ring"></div>
                    <div class="hero-ring-2"></div>
                    <div class="hero-icon">💊</div>
                </div>
                <h1 class="title">شمارش معکوس تا داروسازی</h1>
                <p class="subtitle">
                    روزی که می‌گم <span class="highlight">داروساز شدم</span> 💚
                </p>
            </div>

            <div class="timer-grid">
                <div class="time-card days">
                    <span class="time-number" id="cd-days">۰</span>
                    <span class="time-label">روز</span>
                </div>
                <div class="time-card hours">
                    <span class="time-number" id="cd-hours">۰</span>
                    <span class="time-label">ساعت</span>
                </div>
                <div class="time-card mins">
                    <span class="time-number" id="cd-mins">۰</span>
                    <span class="time-label">دقیقه</span>
                </div>
                <div class="time-card secs">
                    <span class="time-number" id="cd-secs">۰</span>
                    <span class="time-label">ثانیه</span>
                </div>
            </div>

            <div class="dream-box">
                <div class="dream-text">داروساز می‌شم 💊✨</div>
                <div class="dream-sub">هر لحظه، یه قدم نزدیک‌تر به این لحظه</div>
            </div>

            <div class="progress-wrap">
                <div class="progress-header">
                    <span class="label">📈 مسیر تا رسیدن</span>
                    <span class="percent" id="progressPercent">۰٪</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-glow" id="progressGlow"></div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-box weeks">
                    <span class="stat-value" id="statWeeks">۰</span>
                    <span class="stat-label">هفته باقی‌مانده</span>
                </div>
                <div class="stat-box months">
                    <span class="stat-value" id="statMonths">۰</span>
                    <span class="stat-label">ماه باقی‌مانده</span>
                </div>
                <div class="stat-box percent">
                    <span class="stat-value" id="statDays">۰</span>
                    <span class="stat-label">روز باقی‌مانده</span>
                </div>
            </div>

            <div class="quote-box">
                <div class="quote-text" id="quoteText"></div><span class="cursor"></span>
            </div>
        </div>

        <!-- ============ حالت جشن ============ -->
        <div class="celebrate-view" id="celebrateView">
            <div class="celebrate-icon">🎓</div>
            <h2 class="celebrate-title">داروساز شدم!</h2>
            <p class="celebrate-sub">آرزوت محقق شد 💚✨<br>به خودت افتخار کن</p>
        </div>
    </div>
</div>

<script>
/* ============================================================
   تاریخ‌ها
============================================================ */
// تاریخ شروع: ۲۲ شهریور ۱۴۰۵ = 13 September 2026
const START_DATE = new Date(2026, 8, 13, 0, 0, 0); // ماه ۸ = سپتامبر (0-indexed)

// تاریخ هدف: ۱ آذر ۱۴۰۶ = 22 November 2027
const TARGET_DATE = new Date(2027, 10, 22, 0, 0, 0); // ماه ۱۰ = نوامبر

// کل مدت زمان
const TOTAL_DURATION = TARGET_DATE - START_DATE;

/* ============================================================
   ابزار
============================================================ */
function toPersian(n) {
    return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

/* ============================================================
   ساخت ذرات شناور
============================================================ */
function createParticles() {
    const container = document.getElementById('particlesLayer');
    const icons = ['💊', '✨', '⭐', '💚', '🎯', '💫', '🌟', '🩺', '📚', '🎓'];
    const colors = ['#e11d48', '#fbbf24', '#8b5cf6', '#3b82f6', '#06b6d4', '#10b981'];
    
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = icons[Math.floor(Math.random() * icons.length)];
        p.style.left = Math.random() * 100 + '%';
        p.style.fontSize = (10 + Math.random() * 16) + 'px';
        p.style.color = colors[Math.floor(Math.random() * colors.length)];
        p.style.animationDuration = (8 + Math.random() * 10) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(p);
    }
}

/* ============================================================
   ساخت ستاره‌های چشمک‌زن
============================================================ */
function createStars() {
    const container = document.getElementById('starsLayer');
    
    for (let i = 0; i < 50; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3) + 's';
        s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        
        // بعضی ستاره‌ها رنگی باشن
        if (Math.random() > 0.7) {
            const colors = ['#fbbf24', '#fb7185', '#a78bfa', '#34d399'];
            const c = colors[Math.floor(Math.random() * colors.length)];
            s.style.background = c;
            s.style.boxShadow = `0 0 8px ${c}`;
        }
        
        container.appendChild(s);
    }
}

/* ============================================================
   شمارش معکوس
============================================================ */
const elDays = document.getElementById('cd-days');
const elHours = document.getElementById('cd-hours');
const elMins = document.getElementById('cd-mins');
const elSecs = document.getElementById('cd-secs');
const elPercent = document.getElementById('progressPercent');
const elFill = document.getElementById('progressFill');
const elGlow = document.getElementById('progressGlow');
const elWeeks = document.getElementById('statWeeks');
const elMonths = document.getElementById('statMonths');
const elStatDays = document.getElementById('statDays');

let lastSecs = -1;
let lastMins = -1;
let lastHours = -1;
let lastDays = -1;

function updateCountdown() {
    const now = new Date();
    const diff = TARGET_DATE - now;
    
    if (diff <= 0) {
        // رسید! جشن
        document.getElementById('countdownView').style.display = 'none';
        document.getElementById('celebrateView').classList.add('active');
        launchConfetti();
        return;
    }
    
    const totalSecs = Math.floor(diff / 1000);
    const days = Math.floor(totalSecs / 86400);
    const hours = Math.floor((totalSecs % 86400) / 3600);
    const mins = Math.floor((totalSecs % 3600) / 60);
    const secs = totalSecs % 60;
    
    // آپدیت اعداد + انیمیشن tick
    if (days !== lastDays) {
        elDays.textContent = toPersian(days);
        tick(elDays);
        lastDays = days;
        elStatDays.textContent = toPersian(days);
    }
    
    if (hours !== lastHours) {
        elHours.textContent = toPersian(pad2(hours));
        tick(elHours);
        lastHours = hours;
    }
    
    if (mins !== lastMins) {
        elMins.textContent = toPersian(pad2(mins));
        tick(elMins);
        lastMins = mins;
    }
    
    if (secs !== lastSecs) {
        elSecs.textContent = toPersian(pad2(secs));
        tick(elSecs);
        lastSecs = secs;
    }
    
    // آمار
    const weeks = Math.floor(days / 7);
    const months = Math.floor(days / 30);
    elWeeks.textContent = toPersian(weeks);
    elMonths.textContent = toPersian(months);
    
    // پیشرفت
    const elapsed = now - START_DATE;
    let percent = Math.max(0, Math.min(100, (elapsed / TOTAL_DURATION) * 100));
    elPercent.textContent = toPersian(Math.floor(percent)) + '٪';
    elFill.style.width = percent + '%';
    
    // درخشش روی نوار پیشرفت
    elGlow.style.right = (100 - percent) + '%';
}

function tick(el) {
    el.classList.remove('tick');
    // force reflow
    void el.offsetWidth;
    el.classList.add('tick');
}

/* ============================================================
   جمله انگیزشی با تایپ متحرک
============================================================ */
const quotes = [
    'هر تست، یه قدم به داروسازی نزدیک‌تره 💊',
    'تلاش امروز، لبخند فرداست ✨',
    'مسیر سخته، ولی تو از سختی قوی‌تری 💪',
    'یه روز، این لحظه رو با افتخار یاد می‌کنی 🏆',
    'تو می‌تونی، فقط ادامه بده 🔥',
    'هر صفحه، یه پله به سمت رویاست 📚',
    'آرزوت بزرگ‌تر از سختی‌هاست ⭐',
    'وقتی خسته شدی، یادت باشه چرا شروع کردی 💚'
];

let currentQuote = '';
let quoteIndex = 0;
let charIndex = 0;
let isDeleting = false;
const quoteEl = document.getElementById('quoteText');

function typeQuote() {
    const fullQuote = quotes[quoteIndex];
    
    if (!isDeleting) {
        // تایپ
        currentQuote = fullQuote.substring(0, charIndex + 1);
        charIndex++;
        
        if (charIndex === fullQuote.length) {
            isDeleting = true;
            setTimeout(typeQuote, 2500);
            quoteEl.textContent = currentQuote;
            return;
        }
    } else {
        // پاک کردن
        currentQuote = fullQuote.substring(0, charIndex - 1);
        charIndex--;
        
        if (charIndex === 0) {
            isDeleting = false;
            quoteIndex = (quoteIndex + 1) % quotes.length;
        }
    }
    
    quoteEl.textContent = currentQuote;
    const speed = isDeleting ? 30 : 70;
    setTimeout(typeQuote, speed);
}

/* ============================================================
   جشن (کاغذرنگی)
============================================================ */
function launchConfetti() {
    const colors = ['#e11d48', '#fbbf24', '#8b5cf6', '#3b82f6', '#10b981', '#06b6d4', '#fb7185'];
    
    for (let i = 0; i < 80; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (2 + Math.random() * 3) + 's';
        c.style.animationDelay = (Math.random() * 2) + 's';
        c.style.width = (6 + Math.random() * 8) + 'px';
        c.style.height = (6 + Math.random() * 8) + 'px';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(c);
    }
}

/* ============================================================
   راه‌اندازی
============================================================ */
createParticles();
createStars();
updateCountdown();
setInterval(updateCountdown, 1000);
setTimeout(typeQuote, 800);
</script>
</body>
</html>
